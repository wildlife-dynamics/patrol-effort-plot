# Test cases for patrol-trend-plot. Each description states exactly what the
# case tests; every user-facing option appears in at least one case:
#   chart types bar (base) / line (line-chart, time-mode); barmodes group
#   (base, event-sum-fields, month-grouper) / stack (category-mode); palettes
#   colormap (base, category-mode) / custom hex (line-chart); intervals week /
#   month; all four Compares branches (metrics / category / spatial / time);
#   Group Data groupers (month-grouper); per-metric aggregate columns
#   (event-sum-fields); bar value labels on (base, defaults) / off
#   (category-mode); line shape/style/markers styled (line-chart) / defaults
#   (time-mode); y-axis title set (line-chart) / empty (all others).
# All cases are mock-io (canned ER fixtures; er_asia/demo_patrol matches the
# canned patrol data, SpatialGrouperTest the canned spatial feature group).
# The `live` case (mep_dev, mock_io: false) is added in Phase 3 / publish.
#
# Invalid combinations (multi-metric breakdowns, interval not finer than the
# Time comparison period) are covered by ecoscope unit tests — a workflow
# case would fail by design at params validation.

base:
  name: Base
  description: >-
    Tests the FORM-DEFAULT submission end to end (task defaults plus the
    rjsf-override defaults in spec.yaml): single Patrol Count metric, week
    Time Interval, Metrics Only, grouped bars, tab20b color map, status
    "done" — expect weekly chronological bars and a visible legend even
    with a single series.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
      status: ["done"]
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
      time_interval: "week"
      mode:
        mode: "metrics"
    trend_style:
      chart:
        chart_type: "bar"
        barmode: "group"
      palette: "tab20b"

event-sum-fields:
  name: Per-metric event fields
  description: >-
    Tests per-metric event-field aggregation: two metric rows summing
    number_of_animals (total + per-distance rate) beside a plain
    total-distance row; the mock_io_overrides GeoParquet fixture injecting
    that field on the four animal event types (NA on Fire/Poachers Camp —
    sums skip NA; the canned fixture itself has no numeric event_details);
    an omitted trend_style (style task defaults); and multi-series GROUPED
    bars on a month axis — the group-overlap regression (bars must use
    plotly auto-width, not the full-month width).
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_event_type_display_names_from_events: dev/fixtures/event-display-names-number-of-animals.parquet
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "total_encounter", aggregate_column: "number_of_animals"}
        - {metric: "encounters_per_distance", unit: "km", aggregate_column: "number_of_animals"}
        - {metric: "total_distance", unit: "km"}
      time_interval: "month"
      mode:
        mode: "metrics"

category-mode:
  name: By Category (event type)
  description: >-
    Tests the Category breakdown (the patrols events-by-type chart): total
    events split into one stacked segment per event_type_display value
    (display-name resolution feeding the legend); STACKED month bars
    keeping the full-month bar width; bar value labels turned OFF (no
    texttemplate on the traces); and a named color map ("tab20b") sampled
    over the data-dependent series count. Single metric row — the
    breakdown constraint.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "total_events"}
      time_interval: "month"
      mode:
        mode: "category"
        category: "event_type_display"
    trend_style:
      chart:
        chart_type: "bar"
        barmode: "stack"
        show_value_labels: false
      palette: "tab20b"

spatial-mode:
  name: By Spatial Group
  description: >-
    Tests the Spatial Group breakdown: the chart-mode spatial grouper
    resolver against the canned "SpatialGrouperTest" feature group
    (Central/East/West; the resolver keys on metadata.display_name), the
    second spatial-index pass on both branches, and one series per region
    from a single metric.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
      time_interval: "month"
      mode:
        mode: "spatial"
        spatial_feature_group: "SpatialGrouperTest"

month-grouper:
  name: Month grouper
  description: >-
    Tests temporal Group Data grouping: a %B grouper splitting the run into
    one chart per month view (split_groups → merge_widget_views); the
    patrol-day metrics (patrol_days = nunique segment_start_date, and
    encounters_per_patrol_day with its column-less "Events per Patrol Day"
    rate label); and multi-series grouped bars on a week axis.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers:
        - temporal_index: "%B"
    trend_config:
      metrics:
        - {metric: "patrol_days"}
        - {metric: "encounters_per_patrol_day"}
      time_interval: "week"
      mode:
        mode: "metrics"

line-chart:
  name: Line chart
  description: >-
    Tests the Line chart type in metrics mode with every line style option
    set off-default: SMOOTH (spline) DASHED lines with markers hidden
    (mode "lines"; barmode and bar value labels don't apply), a y-axis
    title on the layout, plus the Custom Colors palette branch — the hex
    list cycled over the series.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a line chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
        - {metric: "total_events"}
      time_interval: "week"
      mode:
        mode: "metrics"
    trend_style:
      chart:
        chart_type: "line"
        line_shape: "spline"
        line_dash: "dash"
        show_markers: false
      palette: ["#FF9600", "#F23B0E", "#A100CB", "#F04564", "#03421A", "#3089FF", "#E26FFF", "#8C1700", "#002960", "#FFD000", "#B62879", "#680078", "#005A56", "#0056C7", "#331878", "#E76826"]
      y_axis_title: "Count"

time-mode:
  name: By Time (compare months)
  description: >-
    Tests the Time breakdown as a LINE chart: patrol count per week
    compared across months (one line per month; the canned range yields
    Jan/Feb plus a March trajectory spillover), with weeks bucketed
    relative to each period's start on the integer "Week 1..N" axis so the
    week indices align across months.
  mock_io: true
  params:
    workflow_details:
      name: "Patrol Trend Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
      time_interval: "week"
      mode:
        mode: "time"
        unit: "month"
    trend_style:
      chart:
        chart_type: "line"
