  name: Per-metric event fields
  description: >-
    Tests per-metric event-field aggregation: two metric rows summing
    number_of_animals (total + per-distance rate) beside a plain
    total-distance row; the mock_io_overrides GeoParquet fixture injecting
    that field on the four animal event types (NA on Fire/Poachers Camp —
    sums skip NA; the canned fixture itself has no numeric event_details);
