# Test cases for patrol-effort-plot. Each description states exactly what the
# case tests; every user-facing option appears in at least one case:
#   chart types bar (base) / line (line-chart, time-mode); barmodes group
#   (base, event-sum-fields, month-grouper) / stack (category-mode); palettes
#   colormap (base, category-mode) / custom hex (line-chart); intervals week /
#   month; all four Compares branches (metrics / category / spatial / time);
#   Group Data groupers (month-grouper); per-metric aggregate columns
#   (event-sum-fields); bar value labels on (base, defaults) / off
#   (category-mode); line shape/style/markers styled (line-chart) / defaults
#   (time-mode); y-axis title set (line-chart) / empty (all others).
# The seven original cases are mock-io on the canned ER fixtures (er_asia /
# demo_patrol matches the canned patrol data, SpatialGrouperTest the canned
# spatial feature group) plus the FLAG-OFF leg fixtures (dev/fixtures/flag-off:
# the library's legs over the canned 2015 patrols, no team / member / asset
# keys), so every one exercises the no-`patrol_schemas` path; their params are
# unchanged from before the leg chain and their traces must stay identical
# (dev/compare_before_after.py against a pre-change snapshot).
# The legs-* cases run on the synthetic leg fixtures (dev/fixtures/legs, built
# by dev/fixtures/build_leg_fixtures.py: 2 patrols / 3 legs on 2026-01-05..06,
# 2 members + 1 asset per leg, 6 planted events, LegTestRegions West/East).
# The flag-off-* cases prove the leg presets and roster categories on a site
# without the flag; `empty` the zero-row path; `mep_dev_legs` is live.
#
# Invalid combinations (multi-metric breakdowns, interval not finer than the
# Time comparison period) are covered by ecoscope unit tests — a workflow
# case would fail by design at params validation.

base:
  name: Base
  description: >-
    Tests the FORM-DEFAULT submission end to end (task defaults plus the
    rjsf-override defaults in spec.yaml): single Patrol Count metric, week
    Time Interval, Metrics Only, grouped bars, tab20b color map, status
    "done" — expect weekly chronological bars and a visible legend even
    with a single series.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_patrol_segments_from_patrols_df_and_combined_params: dev/fixtures/flag-off/legs.parquet
    ecoscope.platform.tasks.io.add_patrol_team_names: dev/fixtures/flag-off/legs-team-names.parquet
    ecoscope.platform.tasks.io.add_patrol_roster_names: dev/fixtures/flag-off/legs-roster-names.parquet
    ecoscope.platform.tasks.io.add_patrol_type_display_names: dev/fixtures/flag-off/legs-type-display-names.parquet
  params:
    workflow_details:
      name: "Patrol Effort Plot"
      description: "Patrol metric trends over time as a bar chart."
    er_client_name:
      data_source:
        name: "er_asia"
    time_range:
      since: "2015-01-10T00:00:00"
      until: "2015-02-28T23:59:59"
      timezone:
        label: "UTC (UTC+00:00)"
        tzCode: "UTC"
        name: "(UTC+00:00) UTC"
        utc: "+00:00"
    er_params:
      patrol_types: ["demo_patrol"]
      event_types: []
      status: ["done"]
    groupers:
      groupers: []
    trend_config:
      metrics:
        - {metric: "patrol_count"}
      time_interval: "week"
      mode:
        mode: "metrics"
    trend_style:
      chart:
        chart_type: "bar"
        barmode: "group"
      palette: "tab20b"

