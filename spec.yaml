id: patrol_effort_plot

metadata:
  name: Patrol Effort Plot Workflow
  description: >-
    Track how your patrol effort and patrol results change over time by
    turning EarthRanger patrols and the events reported during them into a
    single interactive bar or line plot of the metrics you choose (patrol
    count, patrol days, distance, duration, event counts, encounter rates,
    area covered, and the patrol leg metrics active duration, elapsed
    duration, leg count and member-days), summarized by week, month, or any
    other time interval and optionally split into one series per category
    (including patrol team, member or asset), spatial region, or time period.
  maintainers:
    - name: Yun Wu
      email: yun@wildlifedynamics.com
      role: owner
    - name: Alex Morling
      email: alexm@earthranger.com
      role: reviewer
  outputs:
    - name: Patrol Effort Plot
      type: plot
      description: >-
        An interactive bar or line plot with one point per time interval
        and one series per selected metric, or one series per category
        value, spatial region, or time period when a breakdown is chosen.
      indicators:
        - name: Patrol Count
        - name: Patrol Days
        - name: Total Distance
        - name: Total Duration
        - name: Total Events
        - name: Total Encounters
        - name: Encounters per Distance
        - name: Encounters per Duration
        - name: Encounters per Patrol
        - name: Encounters per Patrol Day
        - name: Area Covered (Merged)
        - name: Area Covered (Unmerged)
        - name: Active Duration
        - name: Elapsed Duration
        - name: Leg Count
        - name: Member-days
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/patrol-effort-plot
  documentation: https://github.com/wildlife-dynamics/patrol-effort-plot#readme
  readme: README.md
  keywords: [patrol, effort, plot, earthranger]
  thumbnail: resources/thumbnail.png

requirements:
  # >=2.27.1: first release with the patrol leg tasks (legs fetch, team /
  # roster / type-display name resolvers, add_leg_names_to_tracks,
  # add_patrol_type_display_from_legs, explode_for_groupers,
  # apportion_legs_by_spatial_index, get_chart_mode_category_groupers and the
  # four leg presets on the chart's metric union) — ecoscope PR #859.
  - name: python
    version: "3.12.*"
  - name: ecoscope-platform
    version: ">=2.27.1, <2.28.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  properties:
    # --- Patrol and Event Types ---
    "Patrol and Event Types.properties.er_params.title": ""
    "Patrol and Event Types.properties.er_params.properties.patrol_types.ecoscope:transform":
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: patrol_type
          depends_on: properties.er_client_name.properties.data_source.properties.name
    "Patrol and Event Types.properties.er_params.properties.patrol_types.description": >-
      Specify the patrol type(s) to analyze (optional). Leave empty to analyze
      all patrol types.
    "Patrol and Event Types.properties.er_params.properties.event_types.description": >-
      Specify the event type(s) to count (optional). Enter the "Event Types"
      value for each event type — one per field (e.g. "wildlife_sighting_rep").
      Leave empty to count all patrol events.
    "Patrol and Event Types.properties.er_params.properties.event_types.default": []
    "Patrol and Event Types.properties.er_params.properties.status.default": ["done"]

    # --- Group Data: Value + Temporal + Spatial groupers ---
    "Group Data.properties.groupers.title": ""
    "Group Data.properties.groupers.properties.groupers.description": ""
    "Group Data.properties.groupers.properties.groupers.items.anyOf":
      - {"$ref": "#/$defs/ValueGrouper"}
      - {"$ref": "#/$defs/TemporalGrouper"}
      - {"$ref": "#/$defs/SpatialGrouper"}
    "Group Data.properties.groupers.properties.groupers.ecoscope:transform":
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client_name.properties.data_source.properties.name

    # --- Filter Data: hide the task sub-heading ---
    "Filter Data.properties.patrol_filters.title": ""

    # --- Trend Chart: merged config card (set_chart_config) ---
    # Separate task params compile INLINE (round-4 lesson: a single-model
    # param compiles as allOf-$ref into $defs, where the form resolves
    # neither property defaults nor if/then conditionals — the effort-table
    # aggregation pattern works because it is inline). Card field order =
    # param order: Metrics (default Patrol Count) -> Time Interval (default
    # Week) -> Compares. The runtime validator lives on the task's
    # TrendChartConfig carrier.
    "Trend Chart.properties.trend_config.title": ""
    # Form guard restated from the task library's _config_task_json_schema
    # (moves to @register(json_schema_extra=...) once wt-registry > 0.2.2
    # ships task-level extras): breakdown modes cap Metrics at one row, so
    # the form blocks submission of multi-metric breakdowns.
    "Trend Chart.properties.trend_config.allOf":
      - if:
          properties:
            mode:
              properties:
                mode: {"enum": ["category", "spatial", "time"]}
              required: ["mode"]
          required: ["mode"]
        then:
          properties:
            metrics: {"maxItems": 1}
    # The task emits the Compares union as a GENERIC flat allOf/if/then
    # conditional (category is a plain string there). Override paths cannot
    # index into allOf/oneOf lists, so the whole `mode` object is restated
    # wholesale — supplying the workflow-specific category options and the
    # form-only category default (the task model deliberately has neither).
    # NOTE: the EarthRangerEnumResolver transform cannot target the
    # spatial_feature_group field (it lives inside the restated conditional) —
    # fallback is free-text entry with ui:help (see uiSchema below).
    "Trend Chart.properties.trend_config.properties.mode":
      type: "object"
      title: ""
      properties:
        mode:
          type: "string"
          title: "Compares"
          default: "metrics"
          description: >-
            What each series represents: one series per metric (Metrics
            Only), or the single metric split into one series per category
            value, spatial region, or time period.
          oneOf:
            - {"const": "metrics", "title": "Metrics Only"}
            - {"const": "category", "title": "Category"}
            - {"const": "spatial", "title": "Spatial Group"}
            - {"const": "time", "title": "Time"}
      allOf:
        - if:
            properties:
              mode: {"const": "category"}
          then:
            properties:
              category:
                type: "string"
                title: "Category"
                description: "The category to split the metric by."
                default: "event_type_display"
                oneOf:
                  - {"const": "event_type_display", "title": "Event Type"}
                  - {"const": "patrol_type", "title": "Patrol Type"}
                  - {"const": "patrol_subject", "title": "Patrol Subject"}
                  - {"const": "patrol_serial_number", "title": "Patrol Serial Number"}
                  # Patrol leg roster (EarthRanger patrol_schemas flag): resolved
                  # to names on the leg frame and copied onto tracks and events;
                  # one "None" series on sites without the flag. Member / Asset
                  # are list columns, exploded (full credit per member or asset)
                  # before the chart splits series.
                  - {"const": "patrol_team_name", "title": "Team"}
                  - {"const": "patrol_member_names", "title": "Member"}
                  - {"const": "patrol_asset_names", "title": "Asset"}
        - if:
            properties:
              mode: {"const": "spatial"}
          then:
            properties:
              spatial_feature_group:
                type: "string"
                title: "Spatial Feature Group"
                description: >-
                  The EarthRanger spatial feature group whose regions split
                  the metric into series.
        - if:
            properties:
              mode: {"const": "time"}
          then:
            properties:
              unit:
                type: "string"
                title: "Period"
                default: "year"
                description: >-
                  One series per period of this size. The Time Interval above
                  must be smaller than the period compared here — e.g. a
                  Month interval to compare Years.
                oneOf:
                  - {"const": "year", "title": "Years"}
                  - {"const": "month", "title": "Months"}
                  - {"const": "week", "title": "Weeks"}
                  - {"const": "day", "title": "Days"}

    # --- Styling card: merged style task (set_chart_style). Chart
    # Type + conditional Bar Mode come from the task's inline flat
    # conditional; the palette default (Color Map "tab20b", matching the
    # patrols events chart) from the task model. Only the palette union
    # branches are restated, to curate the colormap dropdown. Known gap
    # (accepted): switching to Custom Colors starts with an empty list —
    # the form does not apply anyOf branch defaults, and the flat-conditional
    # alternative rendered worse (both branch fields visible), so it was
    # reverted. ---
    "Styling.properties.trend_style.title": ""
    "Styling.properties.trend_style.properties.palette.anyOf":
      - type: "string"
        title: "Color Map"
        oneOf:
          - {"const": "tab10", "title": "Tab10"}
          - {"const": "tab20", "title": "Tab20"}
          - {"const": "tab20b", "title": "Tab20b"}
          - {"const": "Set2", "title": "Set2"}
          - {"const": "Dark2", "title": "Dark2"}
          - {"const": "Paired", "title": "Paired"}
          - {"const": "viridis", "title": "Viridis"}
          - {"const": "plasma", "title": "Plasma"}
      - type: "array"
        title: "Custom Colors"
        items: {"type": "string"}

  $defs:
    ValueGrouper:
      title: "Category"
      type: "object"
      properties:
        index_name:
          title: "Index Name"
          type: "string"
          oneOf:
            - const: "patrol_serial_number"
              title: "Patrol Serial Number"
            - const: "patrol_type"
              title: "Patrol Type"
            - const: "patrol_subject"
              title: "Patrol Subject"
            # Patrol leg roster (see the Category options above): one view per
            # team, member or asset; "None" on sites without the flag.
            - const: "patrol_team_name"
              title: "Team"
            - const: "patrol_member_names"
              title: "Member"
            - const: "patrol_asset_names"
              title: "Asset"

  uiSchema:
    Patrol and Event Types.er_params.patrol_types.items.ui:help: >-
      If you are on Ecoscope Desktop, "Patrol Type" values can be found in your
      EarthRanger Admin site under Activity → Patrol Types.
    Filter Data.patrol_filters.filter_point_coords.items.ui:options.label: false
    # Spatial feature group inside the Compares union: enum resolver
    # cannot reach it (see note above) — manual entry with help text.
    Trend Chart.trend_config.mode.spatial_feature_group.ui:help: >-
      Enter the spatial feature group name exactly as it appears in your
      EarthRanger site (Mapping → Spatial Feature Group Profiles).
    # Preset metric rows (patrol-effort-table pattern): per-branch uiSchema,
    # one entry per union member IN UNION ORDER (alphabetical by title):
    # active_duration, area_covered_merged, area_covered_unmerged, custom,
    # elapsed_duration, encounters_per_distance, encounters_per_duration,
    # encounters_per_patrol, encounters_per_patrol_day, leg_count,
    # member_days, patrol_count, patrol_days, total_distance, total_duration,
    # total_encounter, total_events (17).
    "Trend Chart.trend_config.metrics.items.oneOf":
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}
      - {"ui:options": {"label": false}, "metric": {"ui:widget": "hidden"}}

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # ---------- Setup ----------
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S %Z'

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  # ---------- Fetch (single patrol call → obs + events) ----------
  - title: Patrol and Event Types
    type: task-group
    description: " "
    tasks:
      - name: Patrol and Event Params
        id: er_params
        task: set_patrols_and_patrol_events_params
        partial:
          client: ${{ workflow.er_client_name.return }}
          time_range: ${{ workflow.time_range.return }}
          include_patrol_details: true
          raise_on_empty: false
          truncate_to_time_range: true
          patrols_overlap_daterange: true
          include_null_geometry: false
          sub_page_size: 100

      - name: Prefetch Patrols
        id: prefetch_patrols
        task: get_patrols_from_combined_params
        partial:
          combined_params: ${{ workflow.er_params.return }}

      - name: Get Patrol Observations
        id: patrol_obs
        task: get_patrol_observations_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_params.return }}

      - name: Unpack Patrol Events
        id: patrol_events
        task: unpack_events_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_params.return }}

      # Resolve event_type slugs to display names (wt-download-patrols
      # pattern) so By Category (Event Type) legends show "Wildlife
      # Sighting" instead of "wildlife_sighting_rep". Canned fixture exists.
      - name: Resolve Event Type Display Names
        id: event_display_names
        task: get_event_type_display_names_from_events
        partial:
          client: ${{ workflow.er_client_name.return }}
          events_gdf: ${{ workflow.patrol_events.return }}
          append_category_names: "duplicates"

  # ---------- Patrol legs (one row per patrol segment) ----------
  # Built from the patrol_segments nested in the prefetched patrols; carries
  # leg_active_seconds, patrol_elapsed_seconds (on each patrol's first leg),
  # leg_member_days and, on sites with the patrol_schemas flag, team / member /
  # asset ids. Pauses are never requested. All inputs bound: no form fields.
  - name: Get Patrol Legs
    id: patrol_legs
    task: get_patrol_segments_from_patrols_df_and_combined_params
    partial:
      patrols_df: ${{ workflow.prefetch_patrols.return }}
      combined_params: ${{ workflow.er_params.return }}

  # Names are resolved once, on the leg frame, and copied onto the tracks and
  # events (add_leg_names_to_tracks below): mock-io keys fixtures per task
  # function, so one io task cannot serve several frames in a mock run.
  - name: Add Team Names to Patrol Legs
    id: legs_team_names
    task: add_patrol_team_names
    partial:
      df: ${{ workflow.patrol_legs.return }}
      client: ${{ workflow.er_client_name.return }}

  - name: Add Member and Asset Names to Patrol Legs
    id: legs_roster_names
    task: add_patrol_roster_names
    partial:
      df: ${{ workflow.legs_team_names.return }}
      client: ${{ workflow.er_client_name.return }}

  # Leg patrol_type becomes the ER display name (slug kept in
  # patrol_type__value); tracks and events get the same name by slug lookup
  # (add_patrol_type_display_from_legs below), so the Patrol Type category
  # gives one series per type across the three row kinds.
  - name: Add Patrol Type Display Names to Patrol Legs
    id: legs_type_display
    task: add_patrol_type_display_names
    partial:
      df: ${{ workflow.legs_roster_names.return }}
      client: ${{ workflow.er_client_name.return }}

  # Same timezone as the tracks so temporal groupers and buckets key alike.
  - name: Convert Patrol Legs to Timezone
    id: convert_legs_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.legs_type_display.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - segment_start
        - segment_end

  # ---------- Filter Data (shared card) ----------
  - title: Filter Data
    type: task-group
    description: " "
    tasks:
      - name: Filters
        id: patrol_filters
        task: ecoscope.platform.tasks.config.set_traj_filters

  - name: Split Bounding Box
    id: bounding_box
    task: ecoscope.platform.tasks.config.get_bounding_box
    partial:
      filters: ${{ workflow.patrol_filters.return }}

  - name: Split Point Coordinates
    id: filter_point_coords
    task: ecoscope.platform.tasks.config.get_filter_point_coords
    partial:
      filters: ${{ workflow.patrol_filters.return }}

  - name: Split Segment Filter
    id: segment_filter
    task: ecoscope.platform.tasks.config.get_segment_filter
    partial:
      filters: ${{ workflow.patrol_filters.return }}

  # ---------- Group Data (dashboard groupers; default [] -> single view) ----------
  - title: Group Data
    type: task-group
    description: >-
      Configure how results are grouped (by category, temporal index or spatial
      feature group) and split into per-group dashboard views.
    tasks:
      - name: Group Data
        id: groupers
        task: set_groupers

  # Resolve spatial groupers (no-op when none configured).
  - task: extract_spatial_grouper_feature_group_names
    id: spatial_group_ids
    partial:
      groupers: ${{ workflow.groupers.return }}

  - task: get_spatial_features_group
    id: fetch_spatial_groups
    partial:
      client: ${{ workflow.er_client_name.return }}
    map:
      argnames: spatial_features_group_name
      argvalues: ${{ workflow.spatial_group_ids.return }}

  - task: resolve_spatial_feature_groups_for_spatial_groupers
    id: resolved_groupers
    skipif:
      conditions:
        - never
    partial:
      groupers: ${{ workflow.groupers.return }}
      spatial_feature_groups: ${{ workflow.fetch_spatial_groups.return }}

  - name: Trend Chart Title
    id: set_chart_title
    task: set_string_var
    partial:
      var: "Patrol Effort"

  # ---------- Trend Chart config (user-facing card) ----------
  # One merged config task = the whole card. Field order comes from the task
  # model: Metrics rows, then Time Interval, then Break Down By (Metrics
  # Only / Category / Spatial Group / Time). The model's schema-level allOf
  # blocks form submission of multi-metric breakdowns and its validator
  # enforces the same rule (plus interval-finer-than-period) at runtime.
  - title: Trend Chart
    type: task-group
    description: >-
      Configure the patrol trend chart: pick the metrics, the time interval
      for the x-axis, and what each series represents.
    tasks:
      - name: Trend Chart Configuration
        id: trend_config
        task: set_chart_config

  # Config splitters — all inputs via partial, so no form fields.
  - name: Split Time Interval
    id: time_interval
    task: get_chart_time_interval
    partial:
      config: ${{ workflow.trend_config.return }}

  - name: Split Breakdown Category
    id: breakdown_category
    task: get_chart_mode_category_column
    partial:
      config: ${{ workflow.trend_config.return }}

  - name: Split Breakdown Time Unit
    id: breakdown_time_unit
    task: get_chart_mode_time_unit
    partial:
      config: ${{ workflow.trend_config.return }}

  - name: Split Breakdown Spatial Groupers
    id: breakdown_spatial_groupers
    task: get_chart_mode_spatial_groupers
    partial:
      config: ${{ workflow.trend_config.return }}

  # The Category breakdown as a one-element grouper list (empty otherwise), so
  # a Member / Asset category explodes its list column before split_groups.
  - name: Split Breakdown Category Groupers
    id: breakdown_category_groupers
    task: get_chart_mode_category_groupers
    partial:
      config: ${{ workflow.trend_config.return }}

  # Resolve the breakdown spatial feature group (empty list -> no-ops).
  - task: extract_spatial_grouper_feature_group_names
    id: breakdown_group_ids
    partial:
      groupers: ${{ workflow.breakdown_spatial_groupers.return }}

  - task: get_spatial_features_group
    id: fetch_breakdown_groups
    partial:
      client: ${{ workflow.er_client_name.return }}
    map:
      argnames: spatial_features_group_name
      argvalues: ${{ workflow.breakdown_group_ids.return }}

  - task: resolve_spatial_feature_groups_for_spatial_groupers
    id: resolved_breakdown_groupers
    skipif:
      conditions:
        - never
    partial:
      groupers: ${{ workflow.breakdown_spatial_groupers.return }}
      spatial_feature_groups: ${{ workflow.fetch_breakdown_groups.return }}

  # ---------- Process Patrol Observations → Trajectories ----------
  - title: Process Patrol Observations
    type: task-group
    description: "Convert patrol observations to trajectory segments and index them for grouping."
    tasks:
      - name: Convert Observations to Timezone
        id: convert_obs_tz
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.patrol_obs.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns: ["fixtime"]

      - name: Remove Column Prefix (Observations)
        id: drop_prefix_obs
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_obs_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Filter Patrol Observations
        id: filter_patrol_obs
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.drop_prefix_obs.return }}
          bounding_box: ${{ workflow.bounding_box.return }}
          filter_point_coords: ${{ workflow.filter_point_coords.return }}
          roi_gdf: null
          roi_name: null
          reset_index: false

      - name: Relocations to Trajectory
        id: patrol_traj
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.filter_patrol_obs.return }}
          trajectory_segment_filter: ${{ workflow.segment_filter.return }}

      - name: Remove Column Prefix (Trajectories)
        id: drop_prefix_traj
        task: drop_column_prefix
        partial:
          df: ${{ workflow.patrol_traj.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      # Align the traj category column name with the events branch:
      # events carry `patrol_type` (the value slug); trajectories carry
      # `patrol_type__value` (encounter-rate-stats convention).
      - name: Rename Trajectory Category Columns
        id: traj_rename_cols
        task: map_columns
        partial:
          df: ${{ workflow.drop_prefix_traj.return }}
          drop_columns: ["patrol_type"]
          retain_columns: []
          rename_columns:
            patrol_type__value: patrol_type
          raise_if_not_found: false
          duplicate_strategy: suffix

      # Team / Member / Asset names from the leg frame, by patrol_segment_id
      # (drop_prefix_traj already unprefixed it; "None" where the site has no
      # patrol_schemas flag), then the patrol type display name by slug.
      - name: Add Leg Names to Trajectories
        id: traj_leg_names
        task: add_leg_names_to_tracks
        partial:
          df: ${{ workflow.traj_rename_cols.return }}
          legs: ${{ workflow.convert_legs_tz.return }}

      - name: Add Patrol Type Display Names to Trajectories
        id: traj_type_display
        task: add_patrol_type_display_from_legs
        partial:
          df: ${{ workflow.traj_leg_names.return }}
          legs: ${{ workflow.convert_legs_tz.return }}

      # Patrol days = distinct calendar days with patrol MOVEMENT: the
      # patrol_days / events_per_patrol_day metrics take nunique of the
      # deterministic `segment_start_date` column added here.
      - name: Add Patrol Date
        id: traj_with_date
        task: decompose_datetime
        partial:
          df: ${{ workflow.traj_type_display.return }}
          datetime_column: segment_start
          components:
            - date
          remove_source: false
          column_prefix: null

      - name: Add Temporal Index to Trajectories
        id: traj_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.traj_with_date.return }}
          time_col: segment_start
          groupers: ${{ workflow.resolved_groupers.return }}
          cast_to_datetime: true
          format: mixed

      - name: Add Spatial Index to Trajectories
        id: traj_spatial_index
        task: add_spatial_index
        partial:
          gdf: ${{ workflow.traj_temporal_index.return }}
          groupers: ${{ workflow.resolved_groupers.return }}

      # Second spatial pass tags rows with the Chart Mode's spatial feature
      # group regions (no-op unless By Spatial Group; idempotency guards
      # skip groups Group Data already indexed).
      - name: Add Breakdown Spatial Index to Trajectories
        id: traj_breakdown_spatial
        task: add_spatial_index
        partial:
          gdf: ${{ workflow.traj_spatial_index.return }}
          groupers: ${{ workflow.resolved_breakdown_groupers.return }}

      # Unify the per-row timestamp column across branches so the chart's
      # x_axis can be a single bound name. Runs AFTER the temporal index
      # (which consumes segment_start).
      - name: Rename Trajectory Time Column
        id: traj_rename_time
        task: map_columns
        partial:
          df: ${{ workflow.traj_breakdown_spatial.return }}
          drop_columns: []
          retain_columns: []
          rename_columns:
            segment_start: trend_time
          raise_if_not_found: true
          duplicate_strategy: suffix

  # ---------- Process Patrol Events ----------
  - title: Process Patrol Events
    type: task-group
    description: "Filter patrol events and index them for grouping."
    tasks:
      - name: Convert Events to Timezone
        id: convert_events_tz
        task: convert_values_to_timezone
        partial:
          # Route through the display-name resolver so event_type_display
          # reaches the combined frame for By Category (Event Type) legends.
          df: ${{ workflow.event_display_names.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns: ["time"]

      - name: Remove Column Prefix (Events)
        id: drop_prefix_events
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_events_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      # Events carry patrol_segment_id and the slug patrol_type: same leg
      # names and display-name copy as the trajectories.
      - name: Add Leg Names to Events
        id: events_leg_names
        task: add_leg_names_to_tracks
        partial:
          df: ${{ workflow.drop_prefix_events.return }}
          legs: ${{ workflow.convert_legs_tz.return }}

      - name: Add Patrol Type Display Names to Events
        id: events_type_display
        task: add_patrol_type_display_from_legs
        partial:
          df: ${{ workflow.events_leg_names.return }}
          legs: ${{ workflow.convert_legs_tz.return }}

      - name: Filter Patrol Events
        id: filter_patrol_events
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.events_type_display.return }}
          bounding_box: ${{ workflow.bounding_box.return }}
          filter_point_coords: ${{ workflow.filter_point_coords.return }}
          roi_gdf: null
          roi_name: null
          reset_index: true

      - name: Add Temporal Index to Events
        id: events_temporal_index
        task: add_temporal_index
        partial:
          df: ${{ workflow.filter_patrol_events.return }}
          time_col: time
          groupers: ${{ workflow.resolved_groupers.return }}
          cast_to_datetime: true
          format: mixed

      - name: Add Spatial Index to Events
        id: events_spatial_index
        task: add_spatial_index
        partial:
          gdf: ${{ workflow.events_temporal_index.return }}
          groupers: ${{ workflow.resolved_groupers.return }}

      # Second spatial pass for the Chart Mode breakdown (see trajectories).
      - name: Add Breakdown Spatial Index to Events
        id: events_breakdown_spatial
        task: add_spatial_index
        partial:
          gdf: ${{ workflow.events_spatial_index.return }}
          groupers: ${{ workflow.resolved_breakdown_groupers.return }}

      # Same unified timestamp column on the events branch (events bucket on
      # their own event time).
      - name: Rename Event Time Column
        id: events_rename_time
        task: map_columns
        partial:
          df: ${{ workflow.events_breakdown_spatial.return }}
          drop_columns: []
          retain_columns: []
          rename_columns:
            time: trend_time
          raise_if_not_found: true
          duplicate_strategy: suffix

  # ---------- Process Patrol Legs ----------
  # Leg indexes mirror the two track passes: temporal on segment_start (the
  # leg's bucket is its start, as the table's temporal index); the spatial
  # levels come from apportioning each leg across the regions its track
  # touches (duration shared by track length, Leg Count once per region). The
  # idempotency guard skips a level the first pass already added. A leg whose
  # track cannot be placed (fixes without a leg id, i.e. no patrol_schemas
  # flag) is DROPPED from spatial views rather than drawn as a "None" region:
  # that series would carry zeros for every track metric, and leg metrics at
  # such a site are blank in spatial views, as Member-days is everywhere there.
  - name: Add Temporal Index to Patrol Legs
    id: legs_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.convert_legs_tz.return }}
      time_col: segment_start
      groupers: ${{ workflow.resolved_groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Apportion Patrol Legs by Spatial Index
    id: legs_spatial_index
    task: apportion_legs_by_spatial_index
    partial:
      legs: ${{ workflow.legs_temporal_index.return }}
      indexed_traj: ${{ workflow.traj_spatial_index.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
      drop_unplaced: true

  - name: Apportion Patrol Legs by Breakdown Spatial Index
    id: legs_breakdown_spatial
    task: apportion_legs_by_spatial_index
    partial:
      legs: ${{ workflow.legs_spatial_index.return }}
      indexed_traj: ${{ workflow.traj_breakdown_spatial.return }}
      groupers: ${{ workflow.resolved_breakdown_groupers.return }}
      drop_unplaced: true

  # Leg rows bucket on segment_start and carry NO patrol_id, so Patrol Count
  # and the per-patrol rates (nunique patrol_id) see exactly today's track and
  # event rows; the leg presets sum leg_active_seconds /
  # patrol_elapsed_seconds / leg_member_days, which are NaN on every other row.
  - name: Rename Leg Time Column
    id: legs_rename_time
    task: map_columns
    partial:
      df: ${{ workflow.legs_breakdown_spatial.return }}
      drop_columns: ["patrol_id"]
      retain_columns: []
      rename_columns:
        segment_start: trend_time
      raise_if_not_found: true
      duplicate_strategy: suffix

  # ---------- Combine & Split ----------
  # concat_dataframes drops skip sentinels, so an empty events branch degrades
  # to "0 events", not a failed run.
  - name: Combine Trajectories, Events and Legs
    id: combined_df
    task: concat_dataframes
    skipif:
      conditions:
        - never
    partial:
      dfs:
        - ${{ workflow.traj_rename_time.return }}
        - ${{ workflow.events_rename_time.return }}
        - ${{ workflow.legs_rename_time.return }}
      ensure_columns:
        - event_type
        - event_type_display
        - patrol_id
        - dist_meters
        - timespan_seconds
        - segment_start_date
        - patrol_subject
        - patrol_type
        - patrol_serial_number
        - trend_time
        - leg_active_seconds
        - patrol_elapsed_seconds
        - leg_member_days
        - patrol_segment_id
        - patrol_team_name
        - patrol_member_names
        - patrol_asset_names
      # Keep the index: add_temporal_index / add_spatial_index append grouper
      # keys as index levels (incl. the breakdown SpatialGrouper_<group>
      # level), and split_groups / the chart groupby use those level names.
      reset_index: false

  # The two list columns (patrol_member_names, patrol_asset_names) are never
  # cast: explode_for_groupers needs real lists.
  - name: Cast Category Columns to String
    id: combined_to_string
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.combined_df.return }}
      columns: ["patrol_serial_number", "patrol_type", "patrol_subject", "patrol_team_name"]

  # Member / Asset as a Group Data grouper or as the Compares category: one
  # row per list element (full credit per member or asset; leg_member_days
  # divided per member row); no-op for every other grouper.
  - name: Explode for Groupers
    id: combined_exploded
    task: explode_for_groupers
    partial:
      df: ${{ workflow.combined_to_string.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  - name: Explode for Breakdown Category
    id: combined_exploded_category
    task: explode_for_groupers
    partial:
      df: ${{ workflow.combined_exploded.return }}
      groupers: ${{ workflow.breakdown_category_groupers.return }}

  - name: Split by Group
    id: split_combined
    task: split_groups
    partial:
      df: ${{ workflow.combined_exploded_category.return }}
      groupers: ${{ workflow.resolved_groupers.return }}

  # ---------- Styling card + Trend Chart instance (per dashboard view) ----------
  # One merged style task = the whole card: Chart Type (Bar/Line), the
  # conditional branch options (Bar: Bar Mode + Show Value Labels; Line:
  # Line Shape + Line Style + Show Markers — revealed via the task model's
  # flat conditional), the Color Palette union (named color map | custom
  # hex colors) and the optional Y-Axis Title.
  - title: Styling
    type: task-group
    description: "Style the trend chart."
    tasks:
      - name: Styling
        id: trend_style
        task: set_chart_style

  # Style splitters — all inputs via partial, so no form fields.
  # Figures compose the config card's metrics with the style card's chart
  # type: one ChartFigure (metric + bar-or-line) per configured metric.
  - name: Split Chart Figures
    id: chart_figures
    task: get_chart_figures
    partial:
      config: ${{ workflow.trend_config.return }}
      style: ${{ workflow.trend_style.return }}

  - name: Split Bar Mode
    id: barmode
    task: get_style_barmode
    partial:
      style: ${{ workflow.trend_style.return }}

  - name: Split Color Palette
    id: palette
    task: get_style_palette
    partial:
      style: ${{ workflow.trend_style.return }}

  # Composing splitters: trace styling (bar value labels / line shape, dash,
  # markers) and layout styling (y-axis title) as PlotStyle / BarLayoutStyle
  # for the chart's advanced inputs.
  - name: Split Plot Style
    id: plot_style
    task: get_style_plot_style
    partial:
      style: ${{ workflow.trend_style.return }}

  - name: Split Layout Style
    id: layout_style
    task: get_style_layout_style
    partial:
      style: ${{ workflow.trend_style.return }}

  # Metric computation happens inside the chart task: figures carry one
  # metric each (in the styled chart type). category comes from the Break
  # Down By splitter: None (one series per metric), a category column, or a
  # SpatialGrouper_<group> index level; time_breakdown turns the chart into
  # a period-over-period overlay (single metric enforced by the task in
  # every breakdown). Fully partialed — no form fields; trace and layout
  # styling (value labels, line shape/dash/markers, y-axis title) come
  # composed from the Styling card via the style splitters.
  - name: Draw Trend Chart
    id: trend_chart
    task: draw_chart
    partial:
      x_axis: trend_time
      figures: ${{ workflow.chart_figures.return }}
      time_interval: ${{ workflow.time_interval.return }}
      category: ${{ workflow.breakdown_category.return }}
      time_breakdown: ${{ workflow.breakdown_time_unit.return }}
      barmode: ${{ workflow.barmode.return }}
      palette: ${{ workflow.palette.return }}
      plot_style: ${{ workflow.plot_style.return }}
      layout_style: ${{ workflow.layout_style.return }}
      widget_id: ${{ workflow.set_chart_title.return }}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.split_combined.return }}

  - name: Persist Trend Chart
    id: trend_chart_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: trend_chart
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.trend_chart.return }}

  - name: Create Trend Chart Widget
    id: trend_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: ${{ workflow.set_chart_title.return }}
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.trend_chart_html.return }}

  - name: Merge Trend Chart Views
    id: trend_widget_merged
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.trend_chart_widget.return }}

  # ---------- Dashboard ----------
  - name: Create Dashboard
    id: trend_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.trend_widget_merged.return }}
      groupers: ${{ workflow.resolved_groupers.return }}
      time_range: ${{ workflow.time_range.return }}
