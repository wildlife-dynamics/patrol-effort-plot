[workspace]
name = "patrol-effort-plot"
channels = ['https://repo.prefix.dev/ecoscope-workflows/', 'conda-forge']
platforms = ['linux-64', 'osx-arm64', 'win-64']

[dependencies]
wt-compiler = "==0.8.3"
python = "<3.15"  # 3.15 resolves ruamel.yaml to 0.17.x, whose C emitter breaks VERSION.yaml dump
go-yq = "*"
ruff = "<0.17"  # 0.17 dropped the python shim wt-compiler needs for `python -m ruff`
graphviz = "*"

[tool.wt]
published = false
